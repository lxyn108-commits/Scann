name: Build Installable Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build ClearScan APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -d "$SDK_DIR/cmdline-tools/latest/bin" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Restore debug signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run OCR & Searchable PDF unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.SearchablePdfAndOcrTest"

      - name: Build installable APK (debug-signed)
        run: |
          gradle :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ClearScan-installable.apk

      - name: Build release APK (when signing secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/ClearScan-release.apk
          else
            echo "Release signing secrets not configured; skipping release APK."
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClearScan-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ClearScan {0}', github.ref_name) || 'ClearScan Latest APK' }}
          body: |
            Installable Android APK for **ClearScan** (Batch Camera Document Scanner & Searchable PDF Generator).

            ### How to Install on Android
            1. Download `ClearScan-installable.apk` (or `ClearScan-release.apk` if present) below on your Android device.
            2. Tap the downloaded `.apk` file and allow **Install unknown apps** if prompted.
          files: dist/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
